<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rock Paper Scissors | Noluthando Basi</title>
  <link rel="stylesheet" href="games.css">
  <link rel="stylesheet" href="rps.css">
</head>
<body><main>
  <nav><a href="../#projects">← Portfolio</a><a href="https://github.com/ZuluBarbie/rock_paper_scissors_C">Original code ↗</a></nav>
  <header><small>PORTFOLIO / ARCADE</small><h1>Rock Paper Scissors</h1></header>
  <p>Pick your throw. First to three points takes the match.</p>
  <div class="arena">
    <div class="fighter"><strong>You</strong><span class="hand" id="your-hand" aria-hidden="true">❔</span><span id="your-pick">Ready</span><b id="your-score">0 / 3</b></div>
    <small class="versus">VS</small>
    <div class="fighter rival"><strong>Computer</strong><span class="hand" id="cpu-hand" aria-hidden="true">❔</span><span id="cpu-pick">Ready</span><b id="cpu-score">0 / 3</b></div>
  </div>
  <p id="status" role="status" aria-atomic="true"></p>
  <div id="board" aria-label="Choose your throw" role="group"></div>
  <div id="controls"></div>
  <noscript>Enable JavaScript to play.</noscript>
</main><script src="common.js"></script><script src="rps.js?v=2"></script></body>
</html>
